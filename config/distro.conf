# =============================================================================
# mycloverOS Distribution Configuration
# =============================================================================

# Distribution identity
DISTRO_NAME="mycloverOS"
DISTRO_VERSION="0.1.0"
DISTRO_CODENAME="seedling"
DISTRO_FULLNAME="mycloverOS ${DISTRO_VERSION} (${DISTRO_CODENAME})"

# Base distribution
BASE_DISTRO="debian"
BASE_CODENAME="bookworm"
BASE_ARCH="amd64"
BASE_MIRROR="http://deb.debian.org/debian"
BASE_SECURITY_MIRROR="http://security.debian.org/debian-security"

# Build output
BUILD_DIR="build"
ISO_LABEL="mycloverOS"
ISO_FILENAME="mycloverOS-${DISTRO_VERSION}-${BASE_ARCH}.iso"

# Editions: server, desktop, micro, kiosk
DEFAULT_EDITION="server"

# CloverStack
CLOVERSTACK_VERSION="1.0.0"
CLOVERSTACK_ROOT="/opt/cloverstack"
CLOVERSTACK_CONFIG="/etc/myclover"
CLOVERSTACK_DATA="/var/lib/cloverstack"
CLOVERSTACK_LOG="/var/log/cloverstack"

# Default enabled modules (server edition)
CLOVERSTACK_DEFAULT_MODULES="netmon sentrylog myclover-vault chappie clovermarket"

# CloverMarket
CLOVERMARKET_ENABLED=true
CLOVERMARKET_PORT=8090
CLOVERMARKET_REGISTRY="https://market.myclover.tech/api/v1"
CLOVERMARKET_DEFAULT_THEME="clover-classic"

# User
DEFAULT_USER="clover"
DEFAULT_HOSTNAME="cloverstack"

# Networking
ENABLE_WIREGUARD=true
ENABLE_MESH=false

# CloverDNS (Privacy-First DNS)
CLOVERDNS_ENABLED=true
CLOVERDNS_DEFAULT_PROFILE="cloudflare"
# Profiles: cloudflare, quad9, adguard, adguard-family, controld,
#           cloudflare-family, max-privacy
CLOVERDNS_DOT_MODE="opportunistic"
# DoT modes: opportunistic (default), yes (strict), no (disabled)

# AI
ENABLE_OLLAMA=true
DEFAULT_AI_MODEL="phi3:mini"
# Available models: phi3:mini, dolphin-x1, llama3.1:8b
# dolphin-x1 = dphn/Dolphin-X1-8B (Llama 3.1 fine-tune, uncensored, 8B params)
# Hardware auto-select: Puck→phi3:mini, Edge/Laptop→dolphin-x1, Rack→dolphin-x1
AI_MODELS_CATALOG="/opt/myclover/ai-models/models.json"

# Containerized Desktop
ENABLE_CLOVERDESKTOP=true
DEFAULT_DESKTOP="auto"
# auto = select based on hardware (Puck→xfce, Edge/Rack→kde)
# Options: kde, gnome, xfce, cinnamon, mate, i3, none
DESKTOP_PORT=3000
DESKTOP_VNC_PORT=3001

# CloverVisor (Hypervisor Blackbox Edition)
ENABLE_CLOVERVISOR=false           # Enabled only in hypervisor edition
CLOVERVISOR_PORT=8006              # Web management UI port
CLOVERVISOR_STORAGE="auto"         # auto | zfs | lvm-thin | dir
CLOVERVISOR_NETWORK="ovs"          # ovs | linux-bridge
CLOVERVISOR_BLACKBOX=true          # Read-only root, no SSH, watchdog
CLOVERVISOR_GPU_PASSTHROUGH=false  # VFIO/IOMMU GPU passthrough
CLOVERVISOR_CLUSTER=false          # HA clustering (Corosync/Pacemaker)
CLOVERVISOR_BACKUP="restic"        # Backup engine: restic | zfs-send | both

# CloverNAS (NAS Edition)
ENABLE_CLOVERNAS_EDITION=false     # Enabled only in NAS edition
CLOVERNAS_WEB_PORT=8080            # Cockpit web UI port
CLOVERNAS_STORAGE="zfs"            # ZFS + auto-pool
CLOVERNAS_PROTOCOLS="smb,nfs"      # Enabled sharing protocols
CLOVERNAS_SNAPSHOTS=true           # Auto-snapshot + ransomware shield
CLOVERNAS_APPS=true                # Docker app catalog (Plex, Nextcloud, etc)
CLOVERNAS_REPLICATION=false        # ZFS send/receive replication
CLOVERNAS_CLUSTER=false            # HA clustering (Corosync/Pacemaker/DRBD)

# CloverCreate (Creator Edition)
ENABLE_CLOVERCREATE=false          # Enabled only in Creator edition
CLOVERCREATE_DESKTOP="xfce"       # Desktop environment
CLOVERCREATE_GPU="auto"           # auto | nvidia | amd | intel
CLOVERCREATE_OLLAMA=true          # Local AI (Ollama)
CLOVERCREATE_STREAMING=false      # RTMP/HLS streaming server
CLOVERCREATE_RENDER_MESH=false    # Distributed Blender rendering
CLOVERCREATE_REALTIME_AUDIO=true  # JACK low-latency audio

# CloverWall (Firewall Edition)
ENABLE_CLOVERWALL=false            # Enabled only in Firewall edition
CLOVERWALL_WEB_PORT=8443           # Cockpit web UI port
CLOVERWALL_DNS="adguard"           # DNS filter: adguard | unbound | none
CLOVERWALL_IDS="suricata"          # IDS/IPS engine
CLOVERWALL_VPN="wireguard"         # VPN: wireguard | openvpn | ipsec | all
CLOVERWALL_MULTIWAN=false          # Multi-WAN failover/load-balance
CLOVERWALL_CLUSTER=false           # HA pair (CloverMesh)

# CloverFactory (Industrial Edition)
ENABLE_CLOVERFACTORY=false         # Enabled only in Industrial edition
CLOVERFACTORY_WEB_PORT=8443        # Cockpit web UI port
CLOVERFACTORY_MQTT=true            # Mosquitto MQTT broker
CLOVERFACTORY_NODERED=true         # Node-RED flow engine
CLOVERFACTORY_TSDB="influxdb"      # Time-series DB
CLOVERFACTORY_GRAFANA=true         # Grafana dashboards
CLOVERFACTORY_MODBUS=true          # Modbus TCP/RTU gateway
CLOVERFACTORY_OT_SEGMENTATION=true # OT/IT network isolation
CLOVERFACTORY_CLUSTER=false        # HA clustering (CloverMesh)
